name: Release

# Push a tag like v0.2.0 to build the zip, create a GitHub release and,
# when the CF_API_KEY secret exists, upload it to CurseForge.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package and publish
        uses: BigWigsMods/packager@v2
        with:
          # Forever is not a flavor the packager knows; set the game version
          # CurseForge lists for it.
          args: -g 1.60.1
